{% if site.social %}
<div class="social">
  <ul class="social__list list-reset">
    {% for social in site.social %}
    <li class="social__item">
      <div class="iconCol swing">
        <a class="social__link" href="{{social.link}}"><img class="mylink" src="{{social.icon}}"></a>
      </div>
      
    </li>
    {% endfor %}
  </ul>
</div>
{% endif %}
