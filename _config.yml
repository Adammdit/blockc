# General settings
title: BlockC
logo: '/images/logo.jpg'
description: BlockC is a rock band based in Dublin Ireland.
baseurl: "" # The subpath of your site, e.g. /blog
url: "https://blockc.ie" # The base hostname & protocol for your site, e.g. http://example.com

# Author settings
author:
  name: BlockC
  avatar: '/images/favicon.png'

# Hero's settings
hero:
  title: 
  description: #It's all about fun, so let's play music :)
  image: '/images/bckg.jpg'

# Contact us settings
contact:
  email: info@blockc.ie # Add your email for contant form
  description:

# NOTE
# This theme comes with a contact form built-in. You can use this form with Formspree service and get up to 50 submissions for free. Also, you can easily switch to another service if you want.

# Footer section
# Example of adding a new link to the footer - {icon: "ion-logo-github", link: "https://github.com"}
# Other icons can be found at https://ionicons.com
social:
- {icon: "/images/icons/facebook_s.png", link: "https://www.facebook.com/groups/281666003096575"}
- {icon: "/images/icons/instagram_s.png", link: "https://www.instagram.com/blockcband"}
- {icon: "/images/icons/youtube_s.png", link: "https://www.youtube.com/@blockcbandofficial"}
- {icon: "/images/icons/bandcamp_s.png", link: "https://blockc.bandcamp.com/album/stranger-to-myself"}
- {icon: "/images/icons/x_s.png", link: "https://x.com/blockcbandire"}
- {icon: "/images/icons/spotify_s.png", link: "https://open.spotify.com/artist/6RvkLqNbmTyIjG8hpolct2?si=tVEMYn3xQb6OdPTak5tNfA"}
- {icon: "/images/icons/breakingtunes_s.png", link: "https://www.breakingtunes.com/blockc"}
- {icon: "/images/icons/linktree_s.png", link: "https://linktr.ee/blockcband"}

# Comment section (Disqus)
#disqus-identifier: mr-brown # Add your shortname for Disqus Comment. For example mr-brown

# Google analytics
google-analytics: # Add your identifier. For example UA-99631805-1.

# Newsletter
mailchimp: false # To enable the mailchimp form, use the value true. To turn off use the value false.
mailchimp-identifier: # Add your MailChimp form identifier. For example - blogenjoyfreedom.us16.list-manage.com/subscribe/post?u=cd56155d76ddeeb4c0bc4d080&amp;id=7a526cd13e

# Turn off footer logo
wid-info: false

# Build settings
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll/tagging

# Pages Path
defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext

include:
  - _pages

# Tags
tag_page_dir:         tag
tag_page_layout:      tag_page
tag_permalink_style:  pretty

sass:
  sass_dir: _sass
  style: compressed